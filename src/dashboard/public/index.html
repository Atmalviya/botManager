<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Monitor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Bot Monitor Dashboard</h1>
            <p class="text-gray-600">Real-time bot monitoring and management</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Summary Cards -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Total Bots</h2>
                <p class="text-4xl font-bold text-blue-600" id="totalBots">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Active Bots</h2>
                <p class="text-4xl font-bold text-green-600" id="activeBots">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Error Count</h2>
                <p class="text-4xl font-bold text-red-600" id="errorCount">0</p>
            </div>
        </div>

        <!-- Bot List -->
        <div class="mt-8 bg-white rounded-lg shadow">
            <div class="p-6">
                <h2 class="text-xl font-semibold mb-4">Bot Status</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Bot ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Heartbeat</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="botList" class="bg-white divide-y divide-gray-200">
                            <!-- Bot rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Error Logs -->
        <div class="mt-8 bg-white rounded-lg shadow">
            <div class="p-6">
                <h2 class="text-xl font-semibold mb-4">Error Logs</h2>
                <div class="overflow-y-auto max-h-64" id="errorLogs">
                    <!-- Error logs will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const POLL_INTERVAL = 5000; // 5 seconds

        function updateBotList(bots) {
            const botList = document.getElementById('botList');
            botList.innerHTML = '';

            bots.forEach(bot => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${bot.bot_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${bot.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                            ${bot.status === 'active' ? 'bg-green-100 text-green-800' : 
                              bot.status === 'error' ? 'bg-red-100 text-red-800' : 
                              'bg-gray-100 text-gray-800'}">
                            ${bot.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${new Date(bot.last_heartbeat).toLocaleString()}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="sendCommand('${bot.bot_id}', 'start')" 
                                class="text-green-600 hover:text-green-900 mr-2">Start</button>
                        <button onclick="sendCommand('${bot.bot_id}', 'stop')" 
                                class="text-red-600 hover:text-red-900 mr-2">Stop</button>
                        <button onclick="sendCommand('${bot.bot_id}', 'restart')" 
                                class="text-blue-600 hover:text-blue-900">Restart</button>
                    </td>
                `;
                botList.appendChild(row);
            });

            // Update summary cards
            document.getElementById('totalBots').textContent = bots.length;
            document.getElementById('activeBots').textContent = bots.filter(b => b.status === 'active').length;
            document.getElementById('errorCount').textContent = bots.reduce((acc, b) => acc + b.error_count, 0);

            // Update error logs
            const errorLogs = document.getElementById('errorLogs');
            errorLogs.innerHTML = '';
            bots.forEach(bot => {
                bot.recent_errors.forEach(error => {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'p-2 border-b border-gray-200';
                    logEntry.innerHTML = `
                        <p class="text-sm">
                            <span class="font-semibold">${bot.name}</span>
                            <span class="text-gray-500">${new Date(error.timestamp).toLocaleString()}</span>
                        </p>
                        <p class="text-sm text-red-600">${error.message}</p>
                    `;
                    errorLogs.appendChild(logEntry);
                });
            });
        }

        async function sendCommand(botId, command) {
            try {
                const response = await fetch(`http://localhost:3001/api/bots/${botId}/command`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command })
                });
                const data = await response.json();
                if (!data.success) {
                    console.error('Command failed:', data.error);
                }
            } catch (error) {
                console.error('Error sending command:', error);
            }
        }

        async function pollBots() {
            try {
                const response = await fetch('http://localhost:3001/api/bots');
                const bots = await response.json();
                updateBotList(bots);
            } catch (error) {
                console.error('Error fetching bots:', error);
            }
        }

        // Initial poll and start polling interval
        pollBots();
        setInterval(pollBots, POLL_INTERVAL);
    </script>
</body>
</html>
